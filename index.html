<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unit Converter Pro — Glassmorphism Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="glass-bg"></div>
    <div class="app-container">
        <header class="app-header">
            <div class="logo-row">
                <span class="logo-emoji">📏</span>
                <div class="title-col">
                    <h1>Unit Converter Pro</h1>
                    <p class="tagline">Fast ledger converter translating metric and imperial measures.</p>
                </div>
            </div>
            <div class="badge">calculators</div>
        </header>

        <main class="workspace-card">
            
            <div style="display: flex; gap: 12px; margin-bottom: 16px;">
                <input type="number" id="unit-val" value="1" style="width: 80px;">
                <select id="unit-from" style="background: var(--bg-secondary); color:#fff; border: 1px solid var(--border); padding: 8px; border-radius: 8px;">
                    <option value="m">Meters</option>
                    <option value="ft">Feet</option>
                </select>
                <button class="btn" onclick="convertUnit()">Convert</button>
            </div>
            <div id="unit-res" style="font-size: 18px; color: var(--accent);">Result: 3.28 Feet</div>
        
        </main>
        
        <footer class="app-footer">
            <p>Created as a premium portfolio piece by <a href="https://github.com/VARSHAN69" target="_blank">@VARSHAN69</a></p>
        </footer>
    </div>
    
    <script src="app.js"></script>
</body>
</html>
